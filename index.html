<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jw図面">
<meta name="theme-color" content="#1f2428">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Jw図面ビューア</title>
<style>
:root {
  /* 図面を主役にした作業画面：黒鉛色の枠、白い作図面、計測は安全オレンジ */
  --frame: #1f2428;
  --frame-2: #2b3137;
  --line: #3a424a;
  --ink: #e9edf0;
  --muted: #9aa5ae;
  --paper: #ffffff;
  --accent: #ff7a1a;
  --accent-ink: #1b1007;
  --sel: #0a84ff;
  --danger: #ff5a52;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--frame); color: var(--ink); font: 14px/1.4 var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { display: grid; grid-template-columns: 76px 1fr; grid-template-rows: 52px 1fr auto; height: 100%; box-sizing: border-box; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--frame-2); border-bottom: 1px solid var(--line); min-width: 0; }
header .title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
header .title b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .title small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--frame); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.hbtn.on { background: var(--ink); color: var(--frame); }
.hbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.hbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

nav { grid-row: 2 / 4; background: var(--frame-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 6px 6px; overflow-y: auto; }
nav .sep { height: 1px; background: var(--line); margin: 4px 4px; flex: none; }
nav .cap { font-size: 10px; color: var(--muted); text-align: center; letter-spacing: .08em; }
.tool { flex: none; width: 64px; min-height: 50px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--ink); }
.tool svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool.on { background: var(--accent); color: var(--accent-ink); }
.tool:disabled { opacity: .35; }

main { position: relative; overflow: hidden; background: var(--paper); }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
/* 書込中の設定を常に見せる欄（図面の左上） */
.wstat { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; border: 1px solid #c9d0d6; background: rgba(255,255,255,.95); color: #1f2428; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.10); max-width: calc(100% - 80px); flex-wrap: wrap; }
.wstat .chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.wstat .chip + .chip { border-left: 1px solid #dde2e6; padding-left: 8px; }
.wstat .sq { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
.wstat .lt { width: 26px; height: 0; border-top: 2px solid #1f2428; }
.wstat b { font-weight: 700; }
.wstat small { color: #59636b; }
/* 線・手書きのアイコンから開く角度メニュー */
.angpop { position: fixed; z-index: 40; display: none; flex-direction: column; gap: 4px; padding: 8px; border-radius: 12px; background: var(--frame-2); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.angpop.open { display: flex; }
.angpop .cap2 { font-size: 11px; color: var(--muted); padding: 0 4px 2px; }
.angpop button { min-width: 150px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--frame); text-align: left; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.angpop button small { color: var(--muted); font-size: 11px; }
.angpop button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.angpop button.on small { color: var(--accent-ink); }
.tool .sub { font-size: 9px; opacity: .8; margin-top: -1px; }
nav .tabs { display: flex; flex-direction: column; gap: 2px; flex: none; }
nav .tabs button { height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--frame); font-size: 12px; color: var(--ink); }
nav .tabs button.on { background: var(--ink); color: var(--frame); font-weight: 700; }
.tgrp { display: none; flex-direction: column; gap: 2px; flex: none; }
.tgrp.on { display: flex; }
.selbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: none; gap: 4px; padding: 6px; border-radius: 12px; background: rgba(31,36,40,.94); color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.25); flex-wrap: wrap; justify-content: center; align-items: center; max-width: calc(100% - 120px); }
.selbar.show { display: flex; }
.selbar b { padding: 0 8px; font-size: 13px; }
.selbar button { height: 36px; padding: 0 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #fff; font-size: 13px; }
.selbar button[data-sel="del"] { color: #ffb3a8; }
#offCtl { display: none; } #offCtl input { width: 110px; height: 38px; border-radius: 8px; border: 1px solid var(--line); padding: 0 8px; font-size: 15px; background: var(--frame); color: var(--ink); }
@media (max-height: 900px) { nav { gap: 0; padding: 4px 6px; } .tool { min-height: 42px; gap: 1px; } .tool svg { width: 20px; height: 20px; } nav .sep { margin: 2px 4px; } }
.set { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.set > b { font-size: 13px; }
.set .opts { display: flex; flex-direction: column; gap: 6px; }
.set .opts button { text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--frame); }
.set .opts button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.set .opts button small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid #c9d0d6; background: rgba(255,255,255,.94); color: #1f2428; font-size: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.snapbadge { position: absolute; left: 50%; transform: translateX(-50%); top: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(31,36,40,.86); color: #fff; font-size: 12px; pointer-events: none; display: none; }

footer { grid-column: 2; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--frame-2); border-top: 1px solid var(--line); min-height: 56px; flex-wrap: wrap; }
#hint { color: var(--muted); font-size: 13px; }
#result { font: 600 18px/1.2 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); flex: 1; min-width: 160px; }
#result small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.fgroup { display: flex; align-items: center; gap: 6px; }
.fgroup label { font-size: 12px; color: var(--muted); }
select { height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--frame); padding: 0 8px; }
#editbar { display: none; align-items: center; gap: 6px; flex-wrap: wrap; }
#editbar.show { display: flex; }
.sw { width: 30px; height: 30px; border-radius: 7px; border: 2px solid transparent; }
.sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--frame-2) inset; }

.drawer { position: absolute; top: 52px; right: 0; bottom: 0; width: min(420px, 92vw); background: var(--frame-2); border-left: 1px solid var(--line); transform: translateX(105%); transition: transform .2s ease; display: flex; flex-direction: column; z-index: 20; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer h2 { margin: 0; font-size: 16px; padding: 14px 16px 6px; display: flex; align-items: center; gap: 8px; }
.drawer h2 span { flex: 1; }
.drawer .body { overflow-y: auto; padding: 6px 12px 16px; flex: 1; -webkit-overflow-scrolling: touch; }
.drawer .row { display: flex; gap: 8px; padding: 0 16px 8px; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 12px; padding: 4px 4px 10px; }
.flist .folder { font-size: 11px; color: var(--muted); padding: 12px 4px 4px; word-break: break-all; }
.flist button.f { width: 100%; text-align: left; padding: 10px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; display: flex; gap: 8px; align-items: baseline; }
.flist button.f:hover, .flist button.f:active { background: var(--frame); }
.flist button.f.cur { border-color: var(--accent); }
.flist button.f span { flex: 1; }
.flist button.f small { color: var(--muted); font-variant-numeric: tabular-nums; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; padding: 0 16px 8px; color: var(--muted); font-size: 12px; }
.crumb { border: 0; background: transparent; color: var(--accent); padding: 4px 4px; border-radius: 6px; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flist button.f.dirb span { font-weight: 600; }
.flist button.f { flex-wrap: wrap; }
.flist button.f small.dir { flex-basis: 100%; font-size: 11px; }
#fsearch { width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--frame); padding: 0 10px; }

.lg { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.lg .gh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--frame); }
.lg .gh .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg .gh small, .lg .ly small { color: var(--muted); font-variant-numeric: tabular-nums; }
.lg .lys { display: none; padding: 4px 10px 8px; grid-template-columns: 1fr 1fr; gap: 4px; }
.lg.exp .lys { display: grid; }
.ly { display: flex; align-items: center; gap: 6px; padding: 6px 6px; border-radius: 6px; min-width: 0; }
.ly span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.tg { width: 44px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--frame-2); position: relative; flex: none; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.tg.on { background: var(--accent); border-color: var(--accent); }
.tg.on::after { left: 20px; background: #fff; }
.exb { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: transparent; }

.mlist .m { padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.mlist .m b { font-variant-numeric: tabular-nums; }
.mlist .m small { color: var(--muted); display: block; }
.mlist .m div { flex: 1; }

#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
#modal.open { display: flex; }
#modal .card { background: var(--frame-2); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(460px, 100%); display: flex; flex-direction: column; gap: 12px; }
#modal h3 { margin: 0; font-size: 16px; }
#modal input[type=text] { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--frame); padding: 0 10px; font-size: 16px; -webkit-user-select: text; user-select: text; }
#modal .acts { display: flex; justify-content: flex-end; gap: 8px; }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: rgba(20,24,27,.94); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 60; display: none; max-width: 90vw; text-align: center; }
#loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.7); color: #1f2428; font-weight: 700; z-index: 5; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #59636b; text-align: center; padding: 24px; pointer-events: none; }
#empty div { max-width: 440px; }
#empty b { display: block; font-size: 18px; color: #1f2428; margin-bottom: 6px; }
input[type=file] { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="bFiles" aria-label="図面を開く">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg>開く
    </button>
    <div class="title"><b id="docName">図面が開かれていません</b><small id="docInfo">.jww ファイルを選んでください</small></div>
    <button class="hbtn" id="bLayers">レイヤ</button>
    <button class="hbtn" id="bMeas">計測結果 <span id="mCount">0</span></button>
    <button class="hbtn" id="bSet">設定</button>
    <button class="hbtn" id="bMono" title="白黒で表示し、補助線を隠します">白黒</button>
    <button class="hbtn primary" id="bSave">保存</button>
  </header>

  <nav id="tools">
    <div class="cap">見る</div>
    <button class="tool on" data-tool="pan"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>移動</button>
    <button class="tool" data-tool="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全体</button>
    <div class="sep"></div>
    <div class="tabs" role="tablist"><button data-grp="meas">測る</button><button data-grp="draw">作図</button><button data-grp="edit">編集</button></div>
    <div class="tgrp" data-grp="meas">
    <button class="tool" data-tool="dist"><svg viewBox="0 0 24 24"><path d="M4 18L20 6"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="6" r="2"/></svg>距離<span class="sub" data-ang></span></button>
    <button class="tool" data-tool="chain"><svg viewBox="0 0 24 24"><path d="M3 18l6-8 6 5 6-10"/><circle cx="9" cy="10" r="1.5"/><circle cx="15" cy="15" r="1.5"/></svg>連続<span class="sub" data-ang></span></button>
    <button class="tool" data-tool="area"><svg viewBox="0 0 24 24"><path d="M4 18L7 5l12 3-2 11z"/></svg>面積</button>
    <button class="tool" data-tool="angle"><svg viewBox="0 0 24 24"><path d="M4 19h16M4 19L16 5"/><path d="M10 19a6 6 0 0 0-2-4.5"/></svg>角度</button>
    </div>
    <div class="tgrp" data-grp="draw">
    <button class="tool" data-tool="line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>線<span class="sub" data-ang></span></button>
    <button class="tool" data-tool="rect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg>四角</button>
    <button class="tool" data-tool="poly"><svg viewBox="0 0 24 24"><path d="M12 3l8.5 6.2-3.2 10H6.7L3.5 9.2z"/></svg>多角形<span class="sub" data-ang></span></button>
    <button class="tool" data-tool="circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 12h8"/></svg>円</button>
    <button class="tool" data-tool="arc"><svg viewBox="0 0 24 24"><path d="M4 18A10 10 0 0 1 18 6"/><circle cx="12" cy="16" r="1.3"/></svg>円弧</button>
    <button class="tool" data-tool="dim"><svg viewBox="0 0 24 24"><path d="M4 8v10M20 8v10M4 13h16"/><path d="M4 13l3-2M4 13l3 2M20 13l-3-2M20 13l-3 2"/></svg>寸法<span class="sub" data-ang></span></button>
    <button class="tool" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>文字</button>
    <button class="tool" data-tool="free"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>手書き<span class="sub" data-ang></span></button>
    </div>
    <div class="tgrp" data-grp="edit">
    <button class="tool" data-tool="sel"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" stroke-dasharray="3 2"/><path d="M14 13l5 5"/></svg>範囲</button>
    <button class="tool" data-tool="offset"><svg viewBox="0 0 24 24"><path d="M4 16L16 4M8 20L20 8"/></svg>複線</button>
    <button class="tool" data-tool="corner"><svg viewBox="0 0 24 24"><path d="M5 20V6h14"/><path d="M5 6l-1.5-2.5M5 6L2.5 6" stroke-dasharray="1.5 2"/></svg>コーナー</button>
    <button class="tool" data-tool="trim"><svg viewBox="0 0 24 24"><path d="M3 12h12"/><path d="M15 12h5" stroke-dasharray="2 2"/><path d="M20 4v16"/></svg>伸縮</button>
    <button class="tool" data-tool="cut"><svg viewBox="0 0 24 24"><path d="M3 12h5M16 12h5M8 5v14M16 5v14"/><path d="M10 12h4" stroke-dasharray="1.5 1.5"/></svg>節間消</button>
    <button class="tool" data-tool="erase"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>消去</button>
    </div>
    <div class="sep"></div>
    <button class="tool" data-act="undo" id="bUndo" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/></svg>戻す</button>
    <button class="tool" data-act="redo" id="bRedo" disabled><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12h2" transform="translate(0 -6)"/></svg>進む</button>
  </nav>

  <main id="main">
    <canvas id="cv"></canvas>
    <div id="empty"><div><b>Jw_cad の図面を開きます</b>左上の「開く」から、プロジェクトの図面か iPad のファイルを選んでください。</div></div>
    <div class="snapbadge" id="snapBadge"></div>
    <button class="wstat" id="wstat" aria-label="書込の設定（タップで線色・線種・レイヤを変更）"></button>
    <div class="zoom"><button id="bSwap" aria-label="直前の道具に切り替え" title="直前の道具に切り替え">⇄</button><button id="zIn" aria-label="拡大">＋</button><button id="zOut" aria-label="縮小">－</button></div>
    <div id="selbar" class="selbar"><b id="selN">0 個</b><button data-sel="move">移動</button><button data-sel="copy">複写</button><button data-sel="rotate">回転</button><button data-sel="mirror">反転</button><button data-sel="del">消去</button><button data-sel="layer">書込レイヤへ</button><button data-sel="attr">今の線色・線種に</button><button data-sel="all">全選択</button><button data-sel="none">解除</button></div>
    <div id="loading">読み込み中…</div>
  </main>

  <footer>
    <div id="result"><span id="hint">ドラッグで移動、2本指で拡大縮小</span></div>
    <div id="editbar">
      <div class="fgroup" id="swatches"></div>
      <div class="fgroup"><label for="selStyle">線種</label><select id="selStyle"><option value="1">実線</option><option value="2">点線</option><option value="5">一点鎖</option><option value="7">二点鎖</option><option value="3">破線</option></select></div>
      <div class="fgroup"><label for="selMoji">文字</label><select id="selMoji"></select></div>
      <div class="fgroup"><label for="selWrite">書込</label><select id="selWrite"></select></div>
      <div class="fgroup" id="offCtl"><label for="offDist">複線の間隔</label><input id="offDist" type="number" inputmode="decimal" min="0" step="any" placeholder="空＝タップ位置"><span>mm</span></div>
    </div>
    <div class="fgroup" id="measCtl">
      <button class="hbtn" id="bFinish" style="display:none">確定</button>
      <button class="hbtn" id="bBack" style="display:none">1点戻す</button>
      <label for="selScale">縮尺</label>
      <select id="selScale"><option value="0">自動</option></select>
      <button class="hbtn" id="bClear">計測を消す</button>
    </div>
  </footer>

  <section class="drawer" id="dFiles" aria-label="図面を開く">

// ---------- 計算と表示 ----------
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

const nf1 = new Intl.NumberFormat('ja-JP', { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('ja-JP', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fmtLen(mm) { return nf1.format(Math.round(mm * 10) / 10) + ' mm'; }
function fmtArea(mm2) { const m2 = mm2 / 1e6; return nf2.format(m2) + ' ㎡（' + nf2.format(m2 / 3.305785) + ' 坪）'; }
function fmtAng(d) { return d.toFixed(2) + '°'; }
function scaleOfGroup(g) { return g == null ? null : (S.H.glay[g].scale || 1); }
function scaleFor(m) {

  if (m.scale) return m.scale;

  return S.commonScale;
}
function summary(m) {
  const sc = scaleFor(m), tag = '1/' + nf1.format(sc);
  if (m.type === 'dist') { const p = m.pts; const dx = Math.abs(p[1].x - p[0].x) * sc, dy = Math.abs(p[1].y - p[0].y) * sc; return { main: fmtLen(dist(p[0], p[1]) * sc), sub: 'ΔX ' + fmtLen(dx) + '　ΔY ' + fmtLen(dy) + '　' + tag, kind: '距離' }; }
  if (m.type === 'chain') { let L = 0; for (let i = 1; i < m.pts.length; i++) L += dist(m.pts[i - 1], m.pts[i]); return { main: '合計 ' + fmtLen(L * sc), sub: (m.pts.length - 1) + '区間　' + tag, kind: '連続距離' }; }

}
function showResult(m) {

  const s = document.createElement('small'); s.textContent = r.sub;

function hint(text) { $('#result').innerHTML = ''; const h = document.createElement('span'); h.id = 'hint'; h.textContent = text; $('#result').append(h); }

function setTool(t) {
  if (t === 'fit') { fit(); return; }
  finishCur(true);
  S.cad = null; if (!SEL_TOOLS.includes(t)) S.sel.clear();
  if (S.tool !== t && S.tool !== 'fit') S.prevTool = S.tool;
  S.tool = t;
  document.querySelectorAll('.tool[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === t));
  $('#editbar').classList.toggle('show', EDIT_TOOLS.includes(t));
  $('#offCtl').style.display = t === 'offset' ? 'flex' : 'none';
  const tb = document.querySelector('.tool[data-tool="' + t + '"]'); if (tb && tb.closest('.tgrp')) showGrp(tb.closest('.tgrp').dataset.grp);
  selCount(); updStat();
  $('#bFinish').style.display = (t === 'chain' || t === 'area' || t === 'poly') ? '' : 'none';
  $('#bBack').style.display = ['dist', 'chain', 'area', 'angle', 'poly', 'arc', 'dim'].includes(t) ? '' : 'none';
  hint(HINTS[t] || '');

function finishCur(cancel) {

  const need = { dist: 2, chain: 2, area: 3, angle: 3 }[c.type];

  requestDraw();
}

}
function onTap(sx, sy) {
  if (!S.doc) return;
  const [wx, wy] = toWorld(sx, sy);
  const t = S.tool;
  if (t === 'pan') return;
  if (t === 'erase') {
    const src = hitEntity(wx, wy);
    if (src == null) { toast('近くに消せる図形がありません'); return; }
    pushUndo(); S.doc.ents.splice(src, 1); afterEdit('1つ消しました（「戻す」で元に戻せます）'); return;
  }
  const p = snap(wx, wy);
  if (CAD[t]) { CAD[t](wx, wy, p, sx, sy); S.hoverSnap = null; return; }
  if (t === 'text') {
    const src = hitEntity(wx, wy), e = src != null ? S.doc.ents[src] : null;
    if (e && e.cls === 'CDataMoji' && !e.text.s.startsWith('^@')) { editText(src); return; }
    placeText(p); return;
  }
  if (!S.cur) S.cur = { type: t, pts: [] };
  if (t === 'poly' && S.cur.pts.length >= 3) {
    const f = S.cur.pts[0], fs = toScreen(f.x, f.y);
    if (Math.hypot(fs[0] - sx, fs[1] - sy) < 16 || (p.x === f.x && p.y === f.y)) { finishCur(false); S.hoverSnap = null; return; }
  }
  if (['line', 'poly', 'dist', 'chain'].includes(t) && S.cur.pts.length >= 1) { const q = constrain(S.cur.pts[S.cur.pts.length - 1], p); p.x = q[0]; p.y = q[1]; }

  if (t === 'dist' && c.pts.length === 2) { S.cur = null; addMeasure(c); }
  else if (t === 'angle' && c.pts.length === 3) { S.cur = null; addMeasure(c); }
  else if (t === 'line' && c.pts.length === 2) { S.cur = null; addLineEnt(c.pts[0], c.pts[1]); }
  else if (t === 'rect' && c.pts.length === 2) { S.cur = null; addRectEnt(c.pts[0], c.pts[1]); }
  else if (t === 'poly') hint(c.pts.length >= 3 ? c.pts.length + '点目。最初の点をタップか「確定」で閉じます' : p.type + 'を拾いました。次の角をタップ');

  else if (t === 'chain' || t === 'area') { if (c.pts.length >= 2) showResult(c); else hint(p.type + 'を拾いました。次の点をタップ'); }

  requestDraw();
}

// ---------- 編集 ----------
function baseEnt(color) { return { group: 0, style: S.style, color: color ?? S.pen, width: 0, layer: S.wl, glayer: S.wg, flg: 0 }; }
function checkWriteVisible() { if (!S.vis[S.wg][S.wl]) toast('書込レイヤが非表示です。レイヤ一覧で表示にしてください'); }
function addLineEnt(a, b) {
  pushUndo();
  S.doc.ents.push(Object.assign(baseEnt(), { cls: 'CDataSen', x1: a.x, y1: a.y, x2: b.x, y2: b.y }));
  afterEdit('線を引きました：' + fmtLen(dist(a, b) * (S.H.glay[S.wg].scale || 1)));
}
function addSegs(pts, close) {
  const n = pts.length, seg = close ? n : n - 1;
  for (let i = 0; i < seg; i++) { const a = pts[i], b = pts[(i + 1) % n]; S.doc.ents.push(Object.assign(baseEnt(), { cls: 'CDataSen', x1: a.x, y1: a.y, x2: b.x, y2: b.y })); }
}
function addRectEnt(a, b) {
  const sc = S.H.glay[S.wg].scale || 1, w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
  if (w < 1e-9 || h < 1e-9) { hint('幅か高さが0です。対角の点をタップしてください'); return; }
  pushUndo();
  addSegs([{ x: a.x, y: a.y }, { x: b.x, y: a.y }, { x: b.x, y: b.y }, { x: a.x, y: b.y }], true);
  afterEdit('四角を描きました：' + fmtLen(w * sc) + ' × ' + fmtLen(h * sc));
}
function addPolyEnt(pts) {
  const sc = S.H.glay[S.wg].scale || 1;
  let A = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; A += a.x * b.y - b.x * a.y; }
  pushUndo(); addSegs(pts, true);
  afterEdit(pts.length + '角形を描きました：面積 ' + fmtArea(Math.abs(A) / 2 * sc * sc));
}
function addCircleEnt(c, p) {
  pushUndo();
  S.doc.ents.push(Object.assign(baseEnt(), { cls: 'CDataEnko', cx: c.x, cy: c.y, r: dist(c, p), start: 0, arc: Math.PI * 2, tilt: 0, flat: 1, full: 1 }));
  afterEdit('円を描きました：半径 ' + fmtLen(dist(c, p) * (S.H.glay[S.wg].scale || 1)));
}
function placeText(p) {
  ask('文字を入力', '', (s) => {
    if (!s) return;
    const M = S.H.moji[S.mojiShu] || { x: 3, y: 3, d: 0.5 };
    const chars = Array.from(s);
    let w = 0; for (const ch of chars) w += isHalf(ch) ? M.x / 2 : M.x; w += M.d * Math.max(0, chars.length - 1);
    pushUndo();
    S.doc.ents.push(Object.assign(baseEnt(), {
      cls: 'CDataMoji', style: 1, width: 1, x1: p.x, y1: p.y, x2: p.x + w, y2: p.y, shu: S.mojiShu,
      sx: M.x, sy: M.y, kan: M.d, deg: 0, font: JWW.mkStr('ＭＳ ゴシック'), text: JWW.mkStr(s),

// ---------- 作図・編集（Jw_cad の基本コマンド） ----------
// 複線・コーナー・伸縮・節間消し・円弧・寸法・範囲選択（移動・複写・回転・反転・消去・属性変更）

  const r = 22 / S.view.s, ids = query(wx, wy, r);

    else if (p.k === 'A') { const q = arcNear(p, wx, wy); d = Math.hypot(q[0] - wx, q[1] - wy); }
    if (d < bd - 1e-9 || (best && Math.abs(d - bd) <= 1e-9 && p.src > best.src)) { bd = d; best = { src: p.src, e, p }; }

  const sm = document.createElement('small'); sm.textContent = (g.name || 'グループ' + hx(S.wg)) + ' / ' + (l.name || 'レイヤ' + hx(S.wl)) + '（1/' + nf1.format(g.scale) + '）';

function straighten(raw) {
  const tol = 10 / S.view.s;
  let pts = simplify(raw, tol);
  // 短すぎる区間（手ぶれ）は前後をつなげて消す
  const minLen = 14 / S.view.s;
  pts = pts.filter((q, i) => i === 0 || i === pts.length - 1 || Math.hypot(q[0] - pts[i - 1][0], q[1] - pts[i - 1][1]) > minLen);
  if (pts.length < 2) return pts;
  const snapEnd = (q) => {
    const sp = snap(q[0], q[1]);
    return ['端点', '交点', '中点', '中心', '点'].includes(sp.type) ? [sp.x, sp.y, true] : [q[0], q[1], false];
  };
  const first = snapEnd(pts[0]);
  const out = [[first[0], first[1]]];
  let lastDir = null;
  for (let i = 1; i < pts.length; i++) {
    const a = out[i - 1];
    const q = constrain({ x: a[0], y: a[1] }, { x: pts[i][0], y: pts[i][1] });
    lastDir = angleDir({ x: a[0], y: a[1] }, { x: pts[i][0], y: pts[i][1] });
    out.push(q);
  }
  const last = snapEnd(pts[pts.length - 1]);
  if (last[2]) {
    const a = out[out.length - 2];
    if (lastDir) {
      // 角度を決めた線は、角度を保ったまま吸着点の位置まで伸び縮みさせる
      const t = (last[0] - a[0]) * lastDir[0] + (last[1] - a[1]) * lastDir[1];
      if (t > 0) out[out.length - 1] = [a[0] + lastDir[0] * t, a[1] + lastDir[1] * t];

}

  for (let i = 1; i < pts.length; i++) S.doc.ents.push(Object.assign(baseEnt(), { cls: 'CDataSen', x1: pts[i - 1][0], y1: pts[i - 1][1], x2: pts[i][0], y2: pts[i][1] }));
  const sc = S.H.glay[S.wg].scale || 1;
  afterEdit(pts.length === 2 ? '直線を引きました：' + fmtLen(Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]) * sc) : '直線 ' + (pts.length - 1) + ' 本に補正して引きました');
}

// zip に入った図面も開ける（iPad で .jww を選べないときの逃げ道。このアプリの保存ファイルもそのまま開ける）
async function unzipJww(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip を読めません');
  let p = dv.getUint32(e + 16, true); const n = dv.getUint16(e + 10, true);
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const flag = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder(flag & 0x800 ? 'utf-8' : 'shift_jis').decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + xl + cl;
    if (!/\.jww$/i.test(name)) continue;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const raw = u8.subarray(start, start + csize);
    if (method === 0) return { bytes: raw.slice(), name: name.split('/').pop() };
    if (method === 8) {
      const out = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return { bytes: new Uint8Array(out), name: name.split('/').pop() };
    }
    throw new Error('この zip の圧縮形式には対応していません');
  }
  throw new Error('zip の中に .jww がありません');
}
